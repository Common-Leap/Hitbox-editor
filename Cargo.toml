[package]
name = "visionary"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "visionary"
path = "src/main.rs"

[dependencies]
# GUI + rendering
eframe = { version = "0.34.3", default-features = false, features = ["wayland", "x11", "wgpu"] }
egui = { version = "0.34.3" }
egui-wgpu = "0.34.3"
egui_extras = { version = "0.34.3", features = ["all_loaders"] }
wgpu = "29.0.0"
glam = "0.28.0"

# SSBU file formats
# Character rendering; effect rendering is performed live in game by slight_replica.
# Pin a known-compatible commit from the canonical upstream main branch.
ssbh_wgpu = { git = "https://github.com/ScanMountGoat/ssbh_wgpu.git", rev = "f7bfb4b3bb3affcd361f80b1f63f6789ee2cc9e5" }
ssbh_data = { version = "0.19.0", features = ["serde"] }
prc = { package = "prc-rs", version = "1.6", features = ["xml-feat"] }
motion_lib = { package = "motion_list_rs", version = "1.5" }
hash40 = "1.3"
# `.eff` parsing, editing, and export.
effect_library = "1.1.0"

# Async + HTTP (for ACMD fetch)
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
reqwest = { version = "0.12", features = ["blocking"] }

# Utilities
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
rfd = "0.15"
dirs = "5"
tempfile = "3"

# Optimize dependencies in debug builds — wgpu/ssbh_wgpu are unusably slow unoptimized
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

# effect_library 1.1.0 writes a BNSH relocation table that lists slots holding no offset; the
# runtime turns each into a pointer to the image base and the game hangs walking the container.
# Build against the local fix until it is published. Remove this once a fixed version is on
# crates.io and the version requirement above is bumped.
[patch.crates-io]
effect_library = { path = "../EffectLibraryRust/crate" }
